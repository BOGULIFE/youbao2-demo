<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FR-022 首页金刚区前端 Mockup</title><style>:root{--orange:#ff4d22;--orange-soft:#fff1ec;--text:#252836;--muted:#9498a8;--line:#eceef3}*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:var(--text);font:13px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.phone{width:390px;min-height:812px;margin:0 auto;background:#f6f7fb;overflow:hidden}.top{height:34px;background:#fff}.banner{height:145px;padding:22px;background:linear-gradient(135deg,#ff9c73,#ff4d22);color:#fff;font-size:24px;font-weight:800}.quick{background:#fff;padding:12px;border-bottom:1px solid var(--line)}.quick-title{font-size:15px;font-weight:800;margin:0 0 10px}.entries{display:grid;grid-template-columns:repeat(4,1fr);column-gap:8px;row-gap:12px}.entry{height:72px;min-width:64px;border:0;background:#fff;text-align:center;color:var(--text);cursor:pointer;padding:0}.entry:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:10px}.icon{width:36px;height:36px;margin:0 auto 5px;border-radius:10px;background:var(--orange-soft);display:grid;place-items:center;font-size:20px}.title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.data{height:86px;margin:12px;background:#fff;border-radius:12px}.skeleton{height:84px;border-radius:10px;background:linear-gradient(90deg,#f1f3f6,#fafafa,#f1f3f6);background-size:200% 100%;animation:shimmer 1.4s infinite}@keyframes shimmer{to{background-position:-200% 0}}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:9px 14px;border-radius:99px;background:#252836;color:#fff;font-size:12px;display:none}.error{margin:12px;padding:12px;border-radius:10px;background:#fff;color:#697386;text-align:center}.retry{margin-top:8px;border:1px solid #ffd1c4;background:var(--orange-soft);color:var(--orange);border-radius:7px;padding:6px 12px;cursor:pointer}</style></head><body><div class="phone"><div class="top"></div><div class="banner">开启创作者成长之旅</div><section class="quick" aria-label="快捷入口"><h2 class="quick-title">快捷入口</h2><div class="entries" id="entries"><button class="entry" data-id="academy" aria-label="新手学院，学习项目基础方法"><span class="icon">🎓</span><span class="title">新手学院</span><span class="sub">学习基础方法</span></button><button class="entry" data-id="activity" aria-label="活动中心，查看平台活动"><span class="icon">🔥</span><span class="title">活动中心</span><span class="sub">查看平台活动</span></button><button class="entry" data-id="income" aria-label="收益中心，查看待结算收益"><span class="icon">💰</span><span class="title">收益中心</span><span class="sub">查看待结算收益</span></button><button class="entry" data-id="tools" aria-label="工具市场，高效完成任务"><span class="icon">🧰</span><span class="title">工具市场</span><span class="sub">高效完成任务</span></button></div></section><div class="data"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>const q=new URLSearchParams(location.search),state=q.get('state')||'loaded',toast=document.getElementById('toast');function feedback(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1000)}if(state==='loading'){document.getElementById('entries').innerHTML='<div class="skeleton"></div>'.repeat(4)}else if(state==='empty'){document.querySelector('.quick').remove()}else if(state==='error'){document.querySelector('.quick').innerHTML='<div class="error">快捷入口暂时无法加载<button class="retry" onclick="location.search='?embed=1&state=loaded'">重试</button></div>'}document.querySelectorAll('.entry').forEach(x=>x.onclick=()=>{feedback('已记录点击');parent.postMessage({type:'fr022-entry-click',entryId:x.dataset.id},'*')});</script></body></html>
