<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FR-022 首页金刚区前端 Mockup</title>
<style>body{margin:0;background:#f4f6fa;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#273247}.phone{width:375px;min-height:812px;background:#f6f7fb;margin:0 auto;overflow:hidden}.top{height:34px;background:#fff}.banner{height:155px;padding:22px;background:linear-gradient(135deg,#ff9e72,#ff4d22);color:#fff;font-size:24px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#fff;padding:18px 12px}.item{text-align:center;font-size:11px;color:#454f63;cursor:pointer}.item span{display:block;width:46px;height:46px;margin:0 auto 7px;border-radius:14px;background:#fff0e8;font-size:25px;line-height:46px}.data{height:90px;margin:14px;background:#fff;border-radius:12px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);padding:9px 14px;border-radius:99px;background:#1e293b;color:#fff;font-size:12px;display:none}</style></head><body><div class="phone"><div class="top"></div><div class="banner">开启创作者成长之旅</div><div class="grid"><div class="item" data-id="academy"><span>🎓</span>新手学院</div><div class="item" data-id="activity"><span>🔥</span>活动中心</div><div class="item" data-id="income"><span>💰</span>收益中心</div><div class="item" data-id="tools"><span>🧰</span>工具市场</div></div><div class="data"></div></div><div class="toast" id="toast"></div><script>document.querySelectorAll('.item').forEach(x=>x.onclick=()=>{document.getElementById('toast').textContent='已上报点击：'+x.dataset.id;document.getElementById('toast').style.display='block';setTimeout(()=>document.getElementById('toast').style.display='none',900);parent.postMessage({type:'fr022-entry-click',entryId:x.dataset.id},'*')});</script></body></html>
